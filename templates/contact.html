{% extends 'base.html' %}
{% block meta %}
    <title>Contact - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="experience-section" id="contacts">
            <div class="container">
                <p class="section-kicker">Stay connected</p>
                <div class="contact-form-card">
                    <h1>Tambah Kontak</h1>
                    <form hx-post="{% url 'main:contact_add' %}"
                            hx-target="#contact-rows"
                            hx-swap="innerHTML"
                            hx-on::after-request="if (event.detail.successful) this.reset()" 
                            class="contact-form">
                        {% csrf_token %}
                        <input type="text" name="name" placeholder="Nama" required>
                        <input type="email" name="email" placeholder="Email" required>
                        <button type="submit" class="button">Tambah</button>
                    </form>
                </div>
                <div class="contact-search">
                    <input type="search" name="q" placeholder="Cari kontak..."
                        hx-get="{% url 'main:contact_search' %}"
                        hx-trigger="keyup changed delay:300ms, search"
                        hx-target="#contact-rows"
                        hx-indicator="#search-indicator">
                    <span id="search-indicator" class="htmx-indicator">Mencari...</span>
                </div>
                <h1>Daftar Kontak</h1>
                <div class="contact-table-wrapper">
                    <table class="contact-table">
                        <thead><tr><th>Nama</th><th>Email</th><th></th></tr></thead>
                        <tbody id="contact-rows">
                        {% include "_contact_rows.html" %}
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
